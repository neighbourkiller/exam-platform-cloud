x-service-env: &service-env
  NACOS_SERVER_ADDR: "nacos:8848"
  NACOS_NAMESPACE: dev
  NACOS_USERNAME: "${NACOS_USERNAME:-nacos}"
  NACOS_PASSWORD: "${NACOS_PASSWORD:?NACOS_PASSWORD is required}"
  MYSQL_HOST: mysql
  REDIS_HOST: redis
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USERNAME: "${RABBITMQ_USERNAME:-exam}"
  RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}"
  MINIO_ENDPOINT: "http://minio:9000"
  MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}"
  MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}"
  JWT_PUBLIC_KEY_LOCATION: "/run/secrets/jwt_public_key"
  SERVICE_CLIENT_SECRET: "${SERVICE_CLIENT_SECRET:?SERVICE_CLIENT_SECRET is required}"

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"
      XXL_JOB_ADMIN_PASSWORD: "${XXL_JOB_ADMIN_PASSWORD:?XXL_JOB_ADMIN_PASSWORD is required}"
      EXAM_DB_PASSWORD: "${EXAM_DB_PASSWORD:?EXAM_DB_PASSWORD is required}"
      NACOS_PASSWORD_HASH: "${NACOS_PASSWORD_HASH:?NACOS_PASSWORD_HASH is required}"
    ports: ["13306:3306"]
    volumes: ["mysql-data:/var/lib/mysql", "./deploy/mysql/init:/docker-entrypoint-initdb.d:ro"]
    healthcheck: { test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\""], interval: 5s, timeout: 3s, retries: 30 }
  redis:
    image: redis:7.4-alpine
    ports: ["16379:6379"]
    volumes: ["redis-data:/data"]
  rabbitmq:
    image: rabbitmq:4.1-management
    environment: { RABBITMQ_DEFAULT_USER: "${RABBITMQ_USERNAME:-exam}", RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}" }
    ports: ["15672:5672", "25672:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}", MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}" }
    ports: ["19000:9000", "19001:9001"]
    volumes: ["minio-data:/data"]
  nacos:
    image: nacos/nacos-server:v3.1.1
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: exam_nacos
      MYSQL_SERVICE_PASSWORD: "${EXAM_DB_PASSWORD:?EXAM_DB_PASSWORD is required}"
      MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_IDENTITY_KEY: "${NACOS_AUTH_IDENTITY_KEY:?NACOS_AUTH_IDENTITY_KEY is required}"
      NACOS_AUTH_IDENTITY_VALUE: "${NACOS_AUTH_IDENTITY_VALUE:?NACOS_AUTH_IDENTITY_VALUE is required}"
      NACOS_AUTH_TOKEN: "${NACOS_AUTH_TOKEN:?NACOS_AUTH_TOKEN is required}"
    ports: ["18081:8080", "18848:8848", "19848:9848", "19849:9849"]
    depends_on: { mysql: { condition: service_healthy } }
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.4.0
    environment:
      PARAMS: "--spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai --spring.datasource.username=exam_xxl --spring.datasource.password=${EXAM_DB_PASSWORD:?EXAM_DB_PASSWORD is required} --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:?XXL_JOB_ACCESS_TOKEN is required}"
    ports: ["18080:8080"]
    depends_on: { mysql: { condition: service_healthy } }
  gateway:
    build: { context: ., args: { JAR_FILE: services/exam-gateway/target/exam-gateway-1.0.0-SNAPSHOT.jar } }
    environment: { NACOS_SERVER_ADDR: "nacos:8848", NACOS_NAMESPACE: dev, NACOS_USERNAME: "${NACOS_USERNAME:-nacos}", NACOS_PASSWORD: "${NACOS_PASSWORD:?NACOS_PASSWORD is required}", JWT_PUBLIC_KEY_LOCATION: "/run/secrets/jwt_public_key", TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}" }
    secrets: [jwt_public_key]
    ports: ["16730:16730"]
    depends_on: [nacos]
  iam-service:
    build: { context: ., args: { JAR_FILE: services/exam-iam-service/target/exam-iam-service-1.0.0-SNAPSHOT.jar } }
    secrets: [jwt_private_key, jwt_public_key]
    environment:
      <<: *service-env
      DB_USERNAME: exam_iam
      DB_PASSWORD: "${EXAM_DB_PASSWORD:?EXAM_DB_PASSWORD is required}"
      JWT_PRIVATE_KEY_LOCATION: "/run/secrets/jwt_private_key"
    depends_on: { mysql: { condition: service_healthy }, nacos: { condition: service_started } }
  academic-service:
    build: { context: ., args: { JAR_FILE: services/exam-academic-service/target/exam-academic-service-1.0.0-SNAPSHOT.jar } }
    environment: { <<: *service-env, SERVICE_CLIENT_ID: exam-academic-service, DB_USERNAME: exam_academic, DB_PASSWORD: "${EXAM_DB_PASSWORD:?EXAM_DB_PASSWORD is required}" }
    secrets: [jwt_public_key]
    depends_on: { mysql: { condition: service_healthy }, nacos: { condition: service_started } }
  content-service:
    build: { context: ., args: { JAR_FILE: services/exam-content-service/target/exam-content-service-1.0.0-SNAPSHOT.jar } }
    environment: { <<: *service-env, SERVICE_CLIENT_ID: exam-content-service, DB_USERNAME: exam_content, DB_PASSWORD: "${EXAM_DB_PASSWORD:?EXAM_DB_PASSWORD is required}" }
    secrets: [jwt_public_key]
    depends_on: { mysql: { condition: service_healthy }, nacos: { condition: service_started } }
  management-service:
    build: { context: ., args: { JAR_FILE: services/exam-management-service/target/exam-management-service-1.0.0-SNAPSHOT.jar } }
    environment: { <<: *service-env, SERVICE_CLIENT_ID: exam-management-service, DB_USERNAME: exam_management, DB_PASSWORD: "${EXAM_DB_PASSWORD:?EXAM_DB_PASSWORD is required}" }
    secrets: [jwt_public_key]
    depends_on: { mysql: { condition: service_healthy }, nacos: { condition: service_started } }
  runtime-service:
    build: { context: ., args: { JAR_FILE: services/exam-runtime-service/target/exam-runtime-service-1.0.0-SNAPSHOT.jar } }
    environment:
      <<: *service-env
      XXL_JOB_ADMIN_ADDRESSES: "http://xxl-job-admin:8080/xxl-job-admin"
      XXL_JOB_ACCESS_TOKEN: "${XXL_JOB_ACCESS_TOKEN:?XXL_JOB_ACCESS_TOKEN is required}"
      XXL_JOB_EXECUTOR_PORT: 19999
      SERVICE_CLIENT_ID: exam-runtime-service
      DB_USERNAME: exam_runtime
      DB_PASSWORD: "${EXAM_DB_PASSWORD:?EXAM_DB_PASSWORD is required}"
    secrets: [jwt_public_key]
    depends_on: { mysql: { condition: service_healthy }, nacos: { condition: service_started }, xxl-job-admin: { condition: service_started } }
  grading-service:
    build: { context: ., args: { JAR_FILE: services/exam-grading-service/target/exam-grading-service-1.0.0-SNAPSHOT.jar } }
    environment: { <<: *service-env, SERVICE_CLIENT_ID: exam-grading-service, DB_USERNAME: exam_grading, DB_PASSWORD: "${EXAM_DB_PASSWORD:?EXAM_DB_PASSWORD is required}" }
    secrets: [jwt_public_key]
    depends_on: { mysql: { condition: service_healthy }, nacos: { condition: service_started } }
  reporting-service:
    build: { context: ., args: { JAR_FILE: services/exam-reporting-service/target/exam-reporting-service-1.0.0-SNAPSHOT.jar } }
    environment: { <<: *service-env, SERVICE_CLIENT_ID: exam-reporting-service, DB_USERNAME: exam_reporting, DB_PASSWORD: "${EXAM_DB_PASSWORD:?EXAM_DB_PASSWORD is required}" }
    secrets: [jwt_public_key]
    depends_on: { mysql: { condition: service_healthy }, nacos: { condition: service_started } }
volumes:
  mysql-data: { name: mysql-data }
  redis-data: { name: redis-data }
  rabbitmq-data: { name: rabbitmq-data }
  minio-data: { name: minio_exam_data }
secrets:
  jwt_private_key:
    file: ./deploy/secrets/jwt-private.pem
  jwt_public_key:
    file: ./deploy/secrets/jwt-public.pem
