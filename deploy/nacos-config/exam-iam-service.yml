spring:
  datasource: { url: "jdbc:mysql://${MYSQL_HOST:mysql}:3306/exam_iam?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai", username: "${DB_USERNAME:exam}", password: "${DB_PASSWORD:exam}" }
  data: { redis: { host: "${REDIS_HOST:redis}", port: 6379, database: 0 } }
  flyway: { enabled: true, locations: "classpath:db/migration" }
jwt:
  issuer: exam-system
  private-key: ${JWT_PRIVATE_KEY:}
  public-key: ${JWT_PUBLIC_KEY:}
  private-key-location: ${JWT_PRIVATE_KEY_LOCATION:}
  public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}
  access-token-expire-minutes: 120
  refresh-token-expire-days: 7
app:
  cors:
    allowed-origins: ["http://localhost:5173", "http://127.0.0.1:5173"]
  auth:
    cookie: { name: exam_refresh_token, path: /api/v1/auth, http-only: true, secure: false, same-site: Lax, max-age-seconds: 604800 }
    rate-limit: { key-prefix: "iam:rate-limit:", window-seconds: 60, login-limit: 10, refresh-limit: 30 }
  service-auth:
    shared-secret: ${SERVICE_CLIENT_SECRET:}
    allowed-clients: [exam-academic-service, exam-content-service, exam-management-service, exam-runtime-service, exam-grading-service, exam-reporting-service]
    token-ttl-seconds: 300
