spring:
  cloud:
    gateway:
      server:
        webflux:
          forwarded:
            enabled: false
          x-forwarded:
            for-enabled: false
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                  - "http://127.0.0.1:5173"
                allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600
          default-filters:
            - "DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_FIRST"
          routes:
            - { id: iam-auth, uri: "lb://exam-iam-service", predicates: ["Path=/api/v1/auth/**"] }
            - { id: iam-admin, uri: "lb://exam-iam-service", predicates: ["Path=/api/v1/admin/users/**,/api/v1/admin/roles/**"] }
            - { id: academic, uri: "lb://exam-academic-service", predicates: ["Path=/api/v1/admin/courses/**,/api/v1/admin/teaching-classes/**,/api/v1/teacher/classes/**,/api/v1/exams/teaching-classes"] }
            - { id: content, uri: "lb://exam-content-service", predicates: ["Path=/api/v1/questions/**,/api/v1/papers/**"] }
            - { id: reporting-results, uri: "lb://exam-reporting-service", predicates: ["Path=/api/v1/exams/student/results,/api/v1/analytics/**,/api/v1/admin/exam-monitor/**,/api/v1/admin/audit-logs"] }
            - { id: grading, uri: "lb://exam-grading-service", predicates: ["Path=/api/v1/grading/**"] }
            - { id: management-publish, uri: "lb://exam-management-service", predicates: ["Path=/api/v1/exams/*/publish,/api/v1/exams/*/terminate,/api/v1/exams/teacher,/api/v1/admin/exam-schedules/**,/api/v1/admin/exams/batch"] }
            - { id: management-create, uri: "lb://exam-management-service", predicates: ["Path=/api/v1/exams", "Method=POST"] }
            - id: runtime-answer-write
              order: -10
              uri: "lb://exam-runtime-service"
              predicates:
                - "Path=/api/v1/exams/*/snapshot,/api/v1/exams/*/submit"
                - "Method=POST"
              filters:
                - "RequestSize=5MB"
            - { id: runtime, uri: "lb://exam-runtime-service", predicates: ["Path=/api/v1/exams/**"] }
app:
  gateway:
    client-ip:
      trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS:}
