spring:
  datasource: { url: "jdbc:mysql://${MYSQL_HOST:mysql}:3306/exam_reporting?serverTimezone=Asia/Shanghai", username: "${DB_USERNAME:exam}", password: "${DB_PASSWORD:exam}" }
  flyway: { enabled: true, locations: "classpath:db/migration" }
app:
  rabbitmq:
    reporting:
      retry:
        max-attempts: ${REPORTING_RETRY_MAX_ATTEMPTS:3}
        initial-interval-ms: ${REPORTING_RETRY_INITIAL_INTERVAL_MS:1000}
        multiplier: ${REPORTING_RETRY_MULTIPLIER:2.0}
        max-interval-ms: ${REPORTING_RETRY_MAX_INTERVAL_MS:10000}
