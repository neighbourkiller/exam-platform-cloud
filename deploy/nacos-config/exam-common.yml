spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 3000
            loggerLevel: basic
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:exam}
    password: ${RABBITMQ_PASSWORD:exam}
    publisher-confirm-type: correlated
    publisher-returns: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
app:
  security:
    default-password: ${APP_DEFAULT_PASSWORD:}
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    exchange: ${OUTBOX_EXCHANGE:exam.events}
    publish-delay-ms: ${OUTBOX_PUBLISH_DELAY_MS:${AUDIT_PUBLISH_DELAY_MS:1000}}
    batch-size: ${OUTBOX_BATCH_SIZE:20}
    worker-count: ${OUTBOX_WORKER_COUNT:4}
    lease-duration-ms: ${OUTBOX_LEASE_DURATION_MS:60000}
    confirm-timeout-ms: ${OUTBOX_CONFIRM_TIMEOUT_MS:3000}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:12}
    backoff-initial-ms: ${OUTBOX_BACKOFF_INITIAL_MS:5000}
    backoff-multiplier: ${OUTBOX_BACKOFF_MULTIPLIER:2.0}
    backoff-max-ms: ${OUTBOX_BACKOFF_MAX_MS:300000}
    backoff-jitter: ${OUTBOX_BACKOFF_JITTER:0.2}
    cleanup-delay-ms: ${OUTBOX_CLEANUP_DELAY_MS:3600000}
    published-retention-ms: ${OUTBOX_PUBLISHED_RETENTION_MS:604800000}
    cleanup-batch-size: ${OUTBOX_CLEANUP_BATCH_SIZE:500}
    cleanup-max-batches: ${OUTBOX_CLEANUP_MAX_BATCHES:10}
exam:
  security:
    jwt:
      issuer: exam-system
      public-key: ${JWT_PUBLIC_KEY:}
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}
    service:
      enabled: ${SERVICE_AUTH_ENABLED:true}
      client-id: ${SERVICE_CLIENT_ID:}
      client-secret: ${SERVICE_CLIENT_SECRET:}
      token-url: ${SERVICE_TOKEN_URL:http://exam-iam-service/internal/v1/service-tokens}
