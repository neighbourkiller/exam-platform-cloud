spring:
  datasource:
    url: "jdbc:mysql://${MYSQL_HOST:mysql}:3306/exam_runtime?serverTimezone=Asia/Shanghai"
    username: "${DB_USERNAME:exam}"
    password: "${DB_PASSWORD:exam}"
    hikari:
      maximum-pool-size: ${APP_RUNTIME_DB_MAX_POOL_SIZE:24}
      minimum-idle: ${APP_RUNTIME_DB_MIN_IDLE:8}
      connection-timeout: ${APP_RUNTIME_DB_CONNECTION_TIMEOUT_MS:2000}
  data: { redis: { host: "${REDIS_HOST:redis}", port: 6379, database: 1 } }
  flyway: { enabled: true, locations: "classpath:db/migration" }
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        exam.timeout.submission.completion.latency: true
      slo:
        exam.timeout.submission.completion.latency: 1s,2s,5s,10s,15s,20s,30s,45s,60s
app:
  timeout-submission:
    enabled: ${APP_TIMEOUT_SUBMISSION_V2_ENABLED:false}
    batch-size: ${APP_TIMEOUT_SUBMISSION_BATCH_SIZE:200}
    worker-count: ${APP_TIMEOUT_SUBMISSION_WORKER_COUNT:8}
    lease-ms: ${APP_TIMEOUT_SUBMISSION_LEASE_MS:60000}
    max-run-ms: ${APP_TIMEOUT_SUBMISSION_MAX_RUN_MS:25000}
    max-attempts: ${APP_TIMEOUT_SUBMISSION_MAX_ATTEMPTS:12}
    backoff-initial-ms: ${APP_TIMEOUT_SUBMISSION_BACKOFF_INITIAL_MS:1000}
    backoff-multiplier: ${APP_TIMEOUT_SUBMISSION_BACKOFF_MULTIPLIER:2.0}
    backoff-max-ms: ${APP_TIMEOUT_SUBMISSION_BACKOFF_MAX_MS:30000}
    backoff-jitter: ${APP_TIMEOUT_SUBMISSION_BACKOFF_JITTER:0.2}
    reconcile-batch-size: ${APP_TIMEOUT_SUBMISSION_RECONCILE_BATCH_SIZE:1000}
  client-lease:
    heartbeat-interval-seconds: ${APP_CLIENT_LEASE_HEARTBEAT_INTERVAL_SECONDS:30}
    lease-timeout-seconds: ${APP_CLIENT_LEASE_TIMEOUT_SECONDS:90}
    persistence-interval-seconds: ${APP_CLIENT_LEASE_PERSISTENCE_INTERVAL_SECONDS:60}
  snapshot:
    flush-interval-ms: ${APP_SNAPSHOT_FLUSH_INTERVAL_MS:900000}
    flush-poll-interval-ms: ${APP_SNAPSHOT_FLUSH_POLL_INTERVAL_MS:30000}
    flush-max-batches-per-run: ${APP_SNAPSHOT_FLUSH_MAX_BATCHES_PER_RUN:10}
    ttl-hours: ${APP_SNAPSHOT_TTL_HOURS:48}
    flush-batch-size: ${APP_SNAPSHOT_FLUSH_BATCH_SIZE:100}
    flush-worker-count: ${APP_SNAPSHOT_FLUSH_WORKER_COUNT:4}
    flush-lease-ms: ${APP_SNAPSHOT_FLUSH_LEASE_MS:60000}
    flush-backoff-initial-ms: ${APP_SNAPSHOT_FLUSH_BACKOFF_INITIAL_MS:5000}
    flush-backoff-multiplier: ${APP_SNAPSHOT_FLUSH_BACKOFF_MULTIPLIER:2.0}
    flush-backoff-max-ms: ${APP_SNAPSHOT_FLUSH_BACKOFF_MAX_MS:300000}
    flush-backoff-jitter: ${APP_SNAPSHOT_FLUSH_BACKOFF_JITTER:0.2}
    flush-max-attempts: ${APP_SNAPSHOT_FLUSH_MAX_ATTEMPTS:12}
    flush-reconcile-interval-ms: ${APP_SNAPSHOT_FLUSH_RECONCILE_INTERVAL_MS:300000}
    flush-reconcile-scan-count: ${APP_SNAPSHOT_FLUSH_RECONCILE_SCAN_COUNT:200}
    flush-failed-retention-hours: ${APP_SNAPSHOT_FLUSH_FAILED_RETENTION_HOURS:168}
    flush-cleanup-interval-ms: ${APP_SNAPSHOT_FLUSH_CLEANUP_INTERVAL_MS:3600000}
    flush-cleanup-batch-size: ${APP_SNAPSHOT_FLUSH_CLEANUP_BATCH_SIZE:100}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:question-images}
    evidence-prefix: proctoring
