spring:
  datasource: { url: "jdbc:mysql://${MYSQL_HOST:mysql}:3306/exam_management?serverTimezone=Asia/Shanghai", username: "${DB_USERNAME:exam}", password: "${DB_PASSWORD:exam}" }
  data: { redis: { host: "${REDIS_HOST:redis}", port: 6379, database: 2 } }
  flyway: { enabled: true, locations: "classpath:db/migration" }
app:
  exam-cache:
    enabled: ${APP_EXAM_CACHE_ENABLED:true}
    ttl-hours: ${APP_EXAM_CACHE_TTL_HOURS:48}
    prewarm-ahead-minutes: ${APP_EXAM_CACHE_PREWARM_AHEAD_MINUTES:10}
    prewarm-scan-delay-millis: ${APP_EXAM_CACHE_PREWARM_SCAN_DELAY_MILLIS:60000}
    prewarm-initial-delay-millis: ${APP_EXAM_CACHE_PREWARM_INITIAL_DELAY_MILLIS:10000}
    prewarm-batch-size: ${APP_EXAM_CACHE_PREWARM_BATCH_SIZE:100}
