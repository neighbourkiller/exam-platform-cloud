spring:
  datasource: { url: "jdbc:mysql://${MYSQL_HOST:mysql}:3306/exam_content?serverTimezone=Asia/Shanghai", username: "${DB_USERNAME:exam}", password: "${DB_PASSWORD:exam}" }
  data: { redis: { host: "${REDIS_HOST:redis}", port: 6379, database: 2 } }
  flyway: { enabled: true, locations: "classpath:db/migration" }
app:
  exam-cache:
    enabled: ${APP_EXAM_CACHE_ENABLED:true}
    ttl-hours: ${APP_EXAM_CACHE_TTL_HOURS:48}
    lock-ttl-millis: ${APP_EXAM_CACHE_LOCK_TTL_MILLIS:5000}
    lock-wait-millis: ${APP_EXAM_CACHE_LOCK_WAIT_MILLIS:500}
    lock-poll-millis: ${APP_EXAM_CACHE_LOCK_POLL_MILLIS:50}
  minio:
    endpoint: "${MINIO_ENDPOINT:http://minio:9000}"
    public-endpoint: "${MINIO_PUBLIC_ENDPOINT:http://localhost:19000}"
    access-key: "${MINIO_ACCESS_KEY}"
    secret-key: "${MINIO_SECRET_KEY}"
    bucket: "${MINIO_BUCKET:question-images}"
    public-read: true
